{{ if . }}
<ul class="articles">
  {{ range . }}
  <li>
    <a href="{{ .RelPermalink }}">
      <time>{{ .Date.Format "Jan 02, 2006" }}</time>
      <span class="title">{{ .Title }}</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </li>
  {{ end }}
</ul>
{{ else }}
<div class="card empty">
  <p class="mono"><span class="prompt">❯</span> ls posts/</p>
  <p class="subtle">Nothing here yet. The first articles are on the way; subscribe via <a href="/index.xml">RSS</a> to catch them.</p>
</div>
{{ end }}
